# Default tool presets for ALIMA agentic workflows.
# Loaded by ToolRegistry at initialization.
# Custom presets can be added here or in ~/.config/alima/tool_presets.yaml

# Full library search stack (GND + web services + cache)
library:
  - search_gnd
  - search_lobid
  - search_swb
  - get_search_cache

# GND-centric lookups + chunked selection
gnd:
  - search_gnd
  - get_gnd_entry
  - get_gnd_batch
  - select_from_gnd_pool

# Classification / DK data collection
classification:
  - get_dk_cache
  - get_classification
  - search_catalog
  - rvk_search
  - rvk_validate

# External-authority lookup plugins (rvk_api / k10plus / dnb) — the same tools the
# chat agent gets automatically, made available to workflow steps that opt in.
lookup:
  - rvk_search
  - rvk_validate
  - k10plus_package
  - dnb_classification

# Empty preset (no tools)
none: []
