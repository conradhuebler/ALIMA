# Manifest des Lookup-Plugins geo_sachdb. Das Verzeichnis ist NICHT als Built-in
# registriert (src/utils/lookups/__init__.py importiert es nicht). Nutzung als
# Tier-2-Code-Plugin: Verzeichnis nach ~/.config/alima/plugins/geo_sachdb/
# kopieren, Code-Plugins erlauben, im Plugins-Tab freigeben.

[plugin]
id = "geo_sachdb"
label = "Lokale Sacherschließungsdatenbank (SQLite)"
category = "lookup"
type = "code"
api_version = "1"

[entry]
module = "provider.py"
class = "GeoSachdbLookup"

[doc]
description = "Lokale Sacherschließungsdatenbank im eigenen SQLite-Schema des Plugins (schema.py, v1; jedes Haus füllt es mit einem eigenen Importer): lokale Schlagwörter aller Arten zu Begriffen, fertige WinIBW-Zeilen (5550 für Schlagwörter, 6700 für Notationen), Abgleich einer Notation mit den lokalen Einträgen."
input = "Suchbegriff, Liste von Begriffen oder Notation."
output = "Lokale Schlagwörter mit Art, PPN, fertiger Zeile und verknüpften Notationen; gefundene und nicht gefundene Begriffe getrennt; Herkunft der Datenbank."
