# Real, loadable code-plugin manifest — blueprint for SRU/MARC-XML-Endpunkte
# (DNB, K10plus, LoC, eigene). To make this YOUR plugin: rename `id` here AND
# the class `id` attribute in provider.py (they must match).

[plugin]
id = "sru"
label = "SRU (MARC-XML)"
category = "search_provider"
type = "code"
api_version = "1"
capabilities = ["title_records", "classification"]

[entry]
module = "provider.py"
class = "SruProvider"

[doc]
description = "SRU-Suche: Titel-Datensätze und Klassifikationen von konfigurierbaren SRU-Endpunkten (DNB, K10plus, …); Preset k10plus in PICA-XML mit lokalen Daten der Bibliothek."
input = "Suchbegriff + Suchtyp (kw/title/author/subject/isbn, bei k10plus auch ppn); Endpoint per Preset oder base_url."
output = "Geparste MARC-Records bzw. bei Preset k10plus PICA-Sätze (Titel, Autoren, Ketten, lokale Notationen …)."
