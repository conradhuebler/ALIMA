# Real, loadable code-plugin manifest — this built-in dir doubles as the
# copyable blueprint for GND-keyword plugins. Built-in manifests are never
# scanned at runtime (only ~/.config/alima/plugins/ is); a unit test keeps
# them valid. To make this YOUR plugin: rename `id` here AND the class `id`
# attribute in provider.py (they must match).

[plugin]
id = "lobid"
label = "Lobid (GND/DNB)"
category = "search_provider"
type = "code"
api_version = "1"
capabilities = ["gnd_keywords"]

[entry]
module = "provider.py"
class = "LobidProvider"

[doc]
description = "GND-Schlagwortsuche über die Lobid-API der Deutschen Nationalbibliothek."
input = "Ein oder mehrere Suchbegriffe (Schlagwort/Titel/Freitext)."
output = "GND-Schlagwort-Kandidaten mit GND-IDs, Häufigkeit und DDC-Notationen."
