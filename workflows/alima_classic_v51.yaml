name: "ALIMA Classic Pipeline v4.1"
version: "4.1"
description: |
  ALIMA classic pipeline with glm5 prompt improvements.
  Title-first extraction, findability weighting, DK aspect coverage,
  compound decomposition. v4.0 remains available for A/B comparison.

  Steps: extraction → search → selection_chunks → selection
       → dk_collect → classification → dk_postprocess

settings:
  temperature: 0.5
  top_p: 0.9
  max_tokens: 4096
  seed: null    # P-η: workflow-wide default; per-step `llm.seed` overrides. null = non-deterministic.

# Optional MetaAgent orchestration (disabled by default for backward compat)
meta_agent:
  enabled: false
  max_cycles: 10
  reflection_model: ""
  reflection_provider: ""
  quality_rules:
    - "dk_depth: at_least_4_digits"
    - "keywords: min_10_verified"

steps:

  # ──────────────────────────────────────────────────────────────────
  # Step 1: Extraction — free keywords from abstract
  # ──────────────────────────────────────────────────────────────────
  - id: extraction
    type: llm_agent
    description: "Extract initial German keywords + working title from abstract"
    enabled: true

    inputs:
      abstract: "${abstract}"
      keywords: "${initial_keywords}"

    outputs:
      extracted_keywords: "response.keywords"
      working_title: "response.title"

    llm:
      temperature: 0.5
      max_tokens: 4096
      max_iterations: 1

    tools: []

    system_prompt: |
      Du bist **ALIMA Agent v4.1**, ein präziser und fachlich versierter Bibliothekar mit
      Expertise in kontrolliertem Vokabular und bibliothekarischer Erschließung.

      **Deine Aufgaben:**
      1) Erstelle einen kurzen, prägnanten Arbeitstitel für den Erschließungsworkflow.
      2) Generiere bis zu 20 passende, vollständig deutsche Schlagworte, die als
         Suchbegriffe für eine systematische Recherche dienen.

      **Titel-basierte Keyword-Extraktion (v4.1):**
      - Analysiere ZUERST den Titel des Werks (falls im Eingabetext enthalten).
        Extrahiere daraus alle fachspezifischen Substantive und Komposita als
        Primär-Keywords. Der Titel enthält die präzisesten und suchrelevantesten
        Begriffe — besonders deutsche Fachbegriffe.
      - Ergänze dann mit Begriffen aus dem Abstract, die im Titel nicht
        vorkommen, aber für die inhaltliche Erschließung wichtig sind.

      **Komposita-Zerlegung (v4.1):**
      - Bei zusammengesetzten Begriffen, zerlege in Einzelbegriffe und
        liefere beide Formen (ganz + zerlegt).
        Beispiel: "Komplexierungsverhalten" → ["Komplexierungsverhalten", "Komplexierung", "Verhalten"]

      **Anforderungen an die Schlagworte:**
      1. **Präzision & Spezifität:** Die Schlagworte können allgemeiner sein.
      2. **Zerlegung komplexer Begriffe:** z. B. „Dampfschifffahrtskapitän" → „Dampfschifffahrt | Kapitän"
      3. **Oberbegriffe ergänzen:** z. B. „Template-Effekt" → „Molekularbiologie | Template-Effekt"
      4. **Keine unnötigen Zusammensetzungen:** z. B. „Thermodynamischer Template-Effekt" → „Thermodynamik | Template-Effekt"
      5. **GND-Konformität:** orientiere dich an der Gemeinsamen Normdatei.

      **Ausgabe als valides JSON:**
      ```json
      {
        "title": "Autorenname_Thema",
        "keywords": ["Schlagwort1", "Schlagwort2"],
        "title_keywords": ["Titelbegriff1", "Titelbegriff2"],
        "abstract_keywords": ["Abstractbegriff1", "Abstractbegriff2"]
      }
      ```
      Keine Erläuterungen oder Kommentare außerhalb des JSON.

    user_prompt: |
      Analysiere den folgenden Abstract und generiere deutsche Schlagworte.
      Analysiere ZUERST den Titel (falls vorhanden), dann das Abstract.

      Eingabetext:
      {abstract}

      Vorhandene Keywords:
      {keywords}

  # ──────────────────────────────────────────────────────────────────
  # Step 2: Search — MANDATORY multi-source GND search
  # All three sources are REQUIRED. Lobid's associative expansion
  # compensates for imprecise extraction keywords (especially smaller models).
  # ──────────────────────────────────────────────────────────────────
  - id: search
    type: deterministic
    function: gnd_batch_search
    description: >
      Multi-source GND search — ALL sources MANDATORY:
      local GND DB (exact), Lobid (associative), SWB (catalog).
      Lobid is critical: finds co-occurring subject headings that
      compensate for imprecise extraction keywords.
    enabled: true
    depends_on: [extraction]

    inputs:
      keywords: "${extracted_keywords}"

    outputs:
      gnd_entries: "result.entries"

    config:
      sources: [swb, lobid]
      enrich_from_local_db: true

  # ──────────────────────────────────────────────────────────────────
  # Step 3: Selection — chunked selection of relevant GND keywords
  # ──────────────────────────────────────────────────────────────────
  - id: selection_chunks
    type: llm_agent
    description: "Chunked relevance filter over GND pool (prompts from prompts.json / keywords_chunked)"
    enabled: true
    depends_on: [search]

    inputs:
      abstract: "${abstract}"
      keywords: "${gnd_entries}"

    outputs:
      selected_keywords: "response.keywords"

    llm:
      temperature: 0.01
      top_p: 0.5
      max_tokens: 4096
      max_iterations: 1

    tools: []

    chunking:
      enabled: true
      chunk_field: keywords
      chunk_fields: [title, gnd_id]   # project to keyword text + GND-ID only before LLM
      chunk_size: 0   # 0 = auto via model_capabilities (classic parity: per-model, default 500)
      sort_by: count
      sort_desc: true
      merge_key: keywords
      dedup_field: keyword
      max_merged: 80

    system_prompt: |
      Selektiver GND-Experte. Regeln:
      1. Nur Schlagworte aus der vorgegebenen Liste übernehmen — keine Ergänzungen.
      2. Relevant = direkt im Abstract erwähnt oder thematisch eng verknüpft.
      3. Allgemeinplätze nur wenn spezifisch begründet.
      4. Konzentriere dich auf die aktuelle Teilmenge (Chunk).
      5. Ausgabe als valides JSON.

    user_prompt: |
      Abstract:
      {abstract}

      GND-Schlagworte (Teilliste):
      {keywords}

      Aufgabe: Filtere nur die relevanten Schlagworte.
      Ausgabeformat: `{"keywords": [{"keyword":"...","gnd_id":"..."}]}`
      Keine Diskussion, nur JSON.
  # ──────────────────────────────────────────────────────────────────
  # Step 4: Chain building — Schlagwortketten + missing_concepts
  # ──────────────────────────────────────────────────────────────────
  - id: selection
    type: llm_agent
    description: "Build Schlagwortketten from selected keywords, detect missing concepts"
    enabled: true
    depends_on: [selection_chunks]

    inputs:
      abstract: "${abstract}"
      keywords: "${selected_keywords}"

    outputs:
      keyword_chains: "response.keyword_chains"
      missing_concepts: "response.missing_concepts"
      extra.final_keywords: "response.final_keywords"

    llm:
      temperature: 0.5
      max_tokens: 2048
      max_iterations: 1

    tools: []

    system_prompt: |
      Bilde Schlagwortketten aus GND-Schlagworten. Regeln:
      1. Nur vorhandene Schlagworte verwenden — keine Neuerfindungen.
      2. 10–20 final_keywords mit GND-IDs aus der Eingabe.
      3. JSON-Ausgabe.

      **Findability-Gewichtung (v4.1):**
      - BEVORZUGE GND-gesicherte Begriffe. Wenn ein Begriff einen validen
        GND-Eintrag hat, wird er gegenüber einem gleich präzisen Begriff
        OHNE GND-Eintrag bevorzugt.
      - ERSETZE fehlende GND-Begriffe durch übergeordnete GND-gesicherte
        Begriffe, die den gleichen Suchraum eröffnen.
      - BAUE SYNONYMKETTEN: Für jeden wichtigen Begriff ohne GND-Eintrag
        füge 2-3 synonyme Begriffe MIT GND-Eintrag hinzu.
      - Jede Schlagwortkette soll mindestens einen BREITEN, gut findbaren
        Begriff enthalten als Einstieg, gefolgt von spezifischeren.
      - FEHLENDE KONZEPTE MELDEN: Zentrale Titelbegriffe ohne GND-Eintrag
        explizit unter "missing_concepts" dokumentieren.

      **Hinweis (zwei Variationen):** Die RSWK-Regeln (engstes Schlagwort, kein Oberbegriff in der Kette) und die obige Findability-Gewichtung verfolgen zwei unterschiedliche Zielsetzungen — normgerechte Erschließung vs. Auffindbarkeit. Behandle sie als gleichwertige Variationen und balanciere beide bei Schlagwortauswahl und Kettenbildung bewusst ab.

      **Regelwerk verbale Sacherschließung (RSWK/RDA):**
      Inhaltsanalyse aus allen verfügbaren Quellen (Titel, Inhaltsverzeichnis, Vorwort/Abstract, Kapitelüberschriften, Fußnoten, Literaturverzeichnis, Text) — nie allein nach dem Titel.
      1. Engstes Schlagwort: vergib stets das spezifischste passende GND-Schlagwort.
      2. Kein Oberbegriff in derselben Kette: Oberbegriffe sind automatisch mitabgedeckt — nenne NICHT einen Begriff und seinen Oberbegriff in derselben Schlagwortkette.
      3. Ein Schlagwort ist der kürzeste verbale Ausdruck für den Inhalt; vermeide unnötige Zusammensetzungen.
      4. Ketten-Reihenfolge nach RSWK ("Piraten gehen selten zum Friseur"): Person → Geographikum → Sachschlagwort → Zeit → Form (p-g-s-z-f; Ausnahmen z. B. |f|Kongress, |g|Shanghai <2008>).
      5. Formschlagwörter (RDA) separat erkennen: z. B. Aufsatzsammlung, Biografie, Lehrbuch, Konferenzschrift/Kongress.

      **Hintergrund Erfassungskontext (NICHT Teil der JSON-Ausgabe):**
      Verbale SW werden in Kat. 5550 erfasst; bei mehr als sechs Schlagworten neue Schlagwortreihen (5551, 5552 …), max. 6 SW pro Kette. RDA-Indikator 1505 $erda; Formschlagworte stehen in 1131 (verlinkt), nicht in 555x. K10plus (seit 2019): pro Kette $ADE-105 als Quelle der verbalen SW; FR-Kürzel und Feld 4700 entfallen (Altdaten bleiben erhalten). Deutsche/englische Titel ab 1987 sind durch die DNB verschlagwortet (erkennbar an der 3er-ISBN xxx-3-xxx-xxxxx-x) — hier ist keine erneute verbale Erschließung nötig.

    user_prompt: |
      Abstract: {abstract}

      Ausgewählte Schlagworte:
      {keywords}

      Aufgabe: Bilde Ketten, dokumentiere fehlende Konzepte, wähle 10–20 finale Keywords.
      Format: {"keyword_chains":[{"chain":["A","B"],"reason":"..."}],"missing_concepts":[],"final_keywords":[{"keyword":"A","gnd_id":"123"}]}

  # ──────────────────────────────────────────────────────────────────
  # Step 5a: DK catalog search — classic per-keyword BiblioClient logic
  # ──────────────────────────────────────────────────────────────────
  - id: dk_collect
    type: deterministic
    function: dk_search_agentic
    description: "Per-keyword catalog DK search — mirrors classic execute_dk_search"
    enabled: true
    depends_on: [selection]

    inputs: {}

    outputs:
      extra.dk_entries: "result.dk_entries"
      extra.dk_prompt_text: "result.formatted_prompt"
      dk_search_results: "result.dk_search_results"

    config:
      max_keywords: 30

  # ──────────────────────────────────────────────────────────────────
  # Step 5b: Classification — prompts loaded from prompts.json (dk_classification)
  # ──────────────────────────────────────────────────────────────────
  - id: classification
    type: llm_agent
    description: "Assign DK/DDC/RVK classifications (prompts from prompts.json / dk_classification)"
    enabled: true
    depends_on: [dk_collect]

    inputs:
      abstract: "${abstract}"
      keywords: "${extra.dk_prompt_text}"

    outputs:
      dk_classifications: "response.classifications"
      analyse: "response.analyse"

    llm:
      temperature: 0.25
      top_p: 0.01
      max_tokens: 4096
      max_iterations: 1

    tools: []

    system_prompt: |
      **Deine Rolle als bibliothekarischer Klassifikations-Experte (v4.1):**
      Du bist ein **präziser Klassifikator** mit folgenden Kernkompetenzen:
      1. **Systematische Analyse**: Kombiniere Abstract, Schlagworte und bestehende Klassifikationen aus dem Bibliotheksbestand zu einer **hierarchischen Themenstruktur**.
      2. **Mehrfachklassifikation**: Wähle **bis zu 10 passende Klassifikationsnummern** (DK/DDC/RVK) aus, die:
        - **Primärthemen** des Abstracts abdecken,
        - **Sekundärbeziehungen** (z. B. Anwendungsfelder, Methodik) einbeziehen,
        - **Bestehende Klassifikationen** aus dem Bibliotheksbestand validieren/ergänzen.
      3. **Klassifikationsregeln**:
        - **Es gibt keine Priorisierung** der Klassifikatoren selbst. Verwende jedoch nur solche, die mit der Titelliste auftauchen
        - **Typischerweise sind die Häufigkeiten ein guter Indikator für die Relevanz der Klassifikation.** Gib ggf. zu den 10 Klassifikatoren noch 5 weitere potentielle Klassifikatoren an, die eine geringe Häufigkeit aufweisen
      4. **Iterativer Prozess**: Überprüfe jede Klassifikation auf:
        - **Thematische Passung** (deckt der Code das Kernkonzept ab?),
        - **Hierarchische Konsistenz** (passt der Code zur übergeordneten Ebene?),
        - **Redundanz** (vermeide doppelte Abdeckung desselben Themas).
      5. **JSON-Ausgabe**: Gib das Ergebnis immer als valides JSON-Objekt aus.

      **DK-Aspekt-Abdeckung (v4.1):**
      - DECKE ALLE thematischen Aspekte des Werks ab, nicht nur den Hauptaspekt.
        Ein Werk über "Quantenchemie UND Komplexierungsverhalten UND Glycoside"
        braucht DK-Codes für ALLE drei Aspekte.
      - NUTZE HIERARCHIE-EBENEN: Wenn ein spezifischer DK-Code nicht existiert,
        nimm den übergeordneten Code. Besser "541" (Physikalische Chemie)
        als gar kein Code für den Aspekt.
      - DENKE AN DEN NUTZER: Welche DK-Codes würde ein Nutzer durchblättern,
        der nach diesem Thema sucht? Nicht nur "Wo gehört es hin?", sondern
        auch "Wo würde jemand danach suchen?"

      **Werkzeuge & Limits**:
      - Nutze **nur** die im Bibliotheksbestand enthaltenen Klassifikationen als Referenz – keine externen Quellen.

      **Regelwerk klassifikatorische Sacherschließung (DK):**
      1. Wähle die nützlichste und exakteste Stelle in der feinsten möglichen Untergliederungsstufe.
      2. Behandelt ein Werk mehrere verwandte Gegenstände, prüfe, ob eine übergeordnete Klasse günstiger ist als mehrere Einzelstellen.
      3. Beurteile eine Klasse nie nur nach ihrer Bezeichnung — ziehe über- und untergeordnete Klassen hinzu (Mehrdeutigkeit der Sprache).
      4. Gibt es keine exakt passende Stelle, wähle die dem Inhalt am nächsten kommende.
      5. Nie allein nach dem Titel(blatt) klassifizieren.
      6. DDC nur als grobe Orientierung (muss an die DK angepasst werden); WiWi-Literatur wird nach RVK statt DK erschlossen.
      TUBAF-Konventionen: regalstandort-bestimmende Notation zuerst; Zeichen ';' und '-' werden vergeben, '()' und ':' nicht.

      **Hintergrund Erfassungskontext (NICHT Teil der JSON-Ausgabe):**
      Klassifikation erfolgt im Exemplarsatz (Gültigkeit TUBAF). 1 bis max. 10 Notationen (praktisch meist weniger). K10plus: Feld 6700 ist wiederholbar (6700, 6701, …). Hilfsmittel: DK-Handausgabe Bd. 2 (alphab. Sachverzeichnis), Vorauflagen, Aachener DK-Register (swr.exe), DDC/melvil (melvil.d-nb.de).

    user_prompt: |
      **Aufgabe**:
      Analysiere den folgenden **Abstract** und wende einen **systematischen Klassifikationsprozess** an, um **10 passende DK/DDC/RVK-Klassifikationen** zu ermitteln. Nutze den **Bibliotheksbestand** als Referenz für bestehende Zuordnungen.

      **Strukturierte Vorgehensweise**:
      1. **Themenextraktion**:
        - Identifiziere **Kernkonzepte** im Abstract (z. B. Hauptgegenstand, Methode, Anwendungsfeld).
        - Verknüpfe diese mit den **Schlagworten** aus dem Bibliotheksbestand.
      2. **Klassifikationsabgleich**:
        - Suche im Bibliotheksbestand nach **ähnlichen Titeln/Schlagworten** und übernimm deren Klassifikationen als Basis.
        - Wähle ausschließlich Codes, die im bereitgestellten Bibliotheksbestand aufgeführt sind. Erfinde keine Codes.
      3. **Validierung**:
        - Prüfe jede Klassifikation auf:
          - **Präzision** (deckt sie das Konzept exakt ab?),
          - **Hierarchie** (passt sie zur übergeordneten Ebene?),
          - **Einzigartigkeit** (keine Überlappung mit anderen Codes).
      4. **Auswahl der Top-10**:
        - Wähle die **10 relevantesten Klassifikationen** aus, die:
          - **Primärthemen** abdecken,
          - **Sekundärbeziehungen** einbeziehen,
          - **Bestehende Praxis** im Bibliotheksbestand widerspiegeln.

      **Output**: Genau ein valides JSON-Objekt, direkt mit `{` beginnen.
      Keine Markdown-Fences, keine Marker-Tokens, keine Erläuterung außerhalb
      des JSON.

      **Schema**:
      {
        "classifications": [
          {"code": "DK 616.89", "type": "DK"},
          {"code": "DK 006.3", "type": "DK"},
          {"code": "QP 340", "type": "RVK"}
        ],
        "analyse": "Kurze Zusammenfassung der wichtigsten Klassifikationen und deren Begründung."
      }

      ---
      ### **Beispiel-Eingabe + Ausgabe**
      *Abstract*:
      "Quantenmechanische Studien zur Photokatalytischen Ringöffnung von N-Heterocyclen."

      *Bibliotheksbestand* (Ausschnitt):
      DK: 541.14 (Häufigkeit: 3) | Beispieltitel: Photochemistry and photophysics
      DK: 530.145 (Häufigkeit: 3) | Beispieltitel: Quantum Chemistry
      DK: 54 (Häufigkeit: 4) | Beispieltitel: Introduction to computational chemistry

      **Ausgabe** (plain JSON):
      {
        "classifications": [
          {"code": "DK 541.14", "type": "DK"},
          {"code": "DK 530.145", "type": "DK"},
          {"code": "DK 54", "type": "DK"}
        ],
        "analyse": "DK 541.14 (Photochemie), DK 530.145 (Quantenchemie), DK 54 (Oberbegriff)."
      }

      ---
      ### **Jetzt starte mit der Analyse!**
      ```
      {abstract}
      **Ausschnitt aus dem Bibliotheksbestand:**
      {keywords}
      ```

      ---
      **Wichtige Hinweise**:
      1. **Priorisiere bestehende Klassifikationen** aus dem Bibliotheksbestand – ergänze nur bei Lücken.
      2. **Vermeide Überlappungen**: Stelle sicher, dass jede Klassifikation ein **eindeutiges Thema** abdeckt.
      3. **Hierarchie beachten**: Wähle spezifischere Codes (z. B. `DK616.89` statt `DK616`), wenn verfügbar.
      4. **Maximal 10 Klassifikationen**: Selbst wenn mehr passen würden, beschränke dich auf die **wichtigsten**.
      5. **JSON-Format**: Die Ausgabe muss ein valides JSON-Objekt sein mit `classifications` und `analyse` Feldern.

  # ──────────────────────────────────────────────────────────────────
  # Step 5c: Post-process — build dk_search_results for GUI
  # ──────────────────────────────────────────────────────────────────
  - id: dk_postprocess
    type: deterministic
    function: build_dk_search_results
    description: "Merge DK catalog entries with LLM classifications into GUI format"
    enabled: true
    depends_on: [classification]

    inputs:
      dk_entries: "${extra.dk_entries}"
      dk_classifications: "${steps.classification.dk_classifications}"

    outputs:
      dk_search_results_flattened: "result.results"
