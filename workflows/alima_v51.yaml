name: "ALIMA Pipeline v5.1"
version: "5.1"
description: |
  Self-contained ALIMA pipeline with glm5 prompt improvements.
  Title-first extraction, findability weighting, DK aspect coverage,
  compound decomposition. v5.0 remains available for A/B comparison.

  Steps: extraction → search → selection_chunks → selection
       → dk_collect → classification → dk_postprocess

  Run via:
    CLI:  alima workflow alima_v51 --input '{"abstract": "..."}'
    GUI:  Pipeline-Tab → workflow dropdown → "ALIMA Pipeline v5.1"

settings:
  temperature: 0.5
  top_p: 0.5
  max_tokens: 32768
  seed: null    # P-η: workflow-wide default; per-step `llm.seed` overrides.

# MetaAgent (PLAN→EXECUTE→REFLECT loop) is ALWAYS active in agentic mode —
# PipelineManager forces enabled=True; the `enabled:` flag below is currently
# ignored. The MetaAgent serializes the workers (steps:) and checks results.
#
# Reflection is OPT-IN per workflow: it runs ONLY because the `reflection:`
# block below exists. Remove the block → pure PLAN→EXECUTE chain with no
# quality gate (the planner alone decides finish). Planner and reflection are
# kept as two separate prompts on purpose so they cross-check each other.
meta_agent:
  enabled: false
  # 8 enabled steps run one-per-cycle; with the targeted missing-concept
  # re-select (+selection_chunks/selection) and a safety buffer, 10 was too
  # tight and the loop hit max_cycles before finishing. - Claude Generated
  max_cycles: 16

  # The MetaAgent planner + reflection cores are GENERIC (ALIMA-branded) in
  # code. The DOMAIN rules (GND/DK/phase order) live HERE and are appended to
  # the generic base at its {workflow_rules} slot. `rules:` augments (preferred);
  # `system_prompt:` would fully replace the base. Planner and reflection rules
  # are kept in sync so the two agents cross-check the same phase model.
  planning:
    # system_prompt: |   # full override (rare); else generic base + rules
    rules: |
      ALIMA-Verschlagwortung — Phasen-Routing:
      - Phasenkette: extraction → search → selection_chunks → selection →
        dk_collect → classification → dk_postprocess.
      - Noch keine Keywords extrahiert → 'extraction'.
      - Keywords vorhanden, aber keine GND-Suche gelaufen → 'search'.
      - GND-Einträge vorhanden, aber keine Auswahl → 'selection_chunks' bzw. 'selection'.
      - Auswahl vorhanden, aber keine DK → 'dk_collect' bzw. 'classification'.
      - dk_collect gelaufen UND Katalogdaten stark (>20 Notationen, >30 Titel) → 'classification'.
      - 'classification' gelaufen UND 'DK-Codes (Ist)' nicht leer → nur noch
        Abschluss-Steps (z.B. 'dk_postprocess'), dann 'finish'. 'classification'
        NICHT ohne einen konkreten, benannten Mangel wiederholen.
      - Fehlende Konzepte als 'offen, noch nicht gesucht' markiert → 'search' (erneut, einmalig).
      - Fehlende Konzepte als 'alle bereits gesucht' markiert → NICHT erneut 'search',
        sondern mit 'dk_collect'/'classification' fortfahren.

  # Reflection quality gate — the PRESENCE of this block switches it on.
  # model/provider empty = workflow's main model. `rules:` is appended to the
  # generic ALIMA Quality Agent base. User-prompt state placeholders:
  # {dk_codes} {has_deep_dk} {missing_concepts} {missing_concepts_searched}
  # {final_keywords} {keyword_chains_count} {catalog_total_titles}
  # {catalog_unique_notations} {current_step} {steps_completed} {analyse_excerpt} …
  reflection:
    model: ""
    provider: ""
    temperature: 0.1
    top_p: 0.9
    max_tokens: 32768
    rules: |
      ALIMA-Verschlagwortung — Phasen & Prüflogik:
      Phasen: initialisation→Keywords | search→GND | selection_chunks→gefiltert |
      selection→Ketten+final_keywords | dk_collect→DK/RVK aus Katalog |
      classification→finale DK-Zuweisung.
      - Nach initialisation: Keywords sinnvoll, deutsch, zerlegt
        (z.B. 'Dampfschifffahrt | Kapitän')?
      - Nach search: GND-Einträge vorhanden, Keywords aussagekräftig?
      - Nach selection: final_keywords (15-20)? missing_concepts vorhanden?
      - Nach dk_collect: Katalogdaten — >20 Notationen UND >30 Titel → genug
        (action=continue).
      - Nach classification: DK-Codes vorhanden (Feld 'DK-Codes (Ist)')? Die
        DK-Tiefe ist DETERMINISTISCH geprüft und wird als 'Hat tiefe DK-Codes'
        geliefert — bewerte die Stelligkeit NICHT selbst, fordere KEINE tieferen
        Codes wenn das Flag 'ja' ist; setze 'shallow_dk' nur wenn 'nein'.
      gaps-Vokabular: missing_concepts, shallow_dk, no_keywords, no_rvk.
      Terminierung (gegen Endlosschleifen):
      - 'classification' gelaufen, DK-Codes vorhanden, 'Hat tiefe DK-Codes'=ja →
        KEIN Rerun: action='finish' (oder 'continue', falls noch ein
        deterministischer Abschluss-Step wie 'dk_postprocess' aussteht).
      - status='complete', sobald classification DK-Codes geliefert hat und keine
        UNGESUCHTEN fehlenden Konzepte mehr offen sind.
      - Fehlende Konzepte gemeldet UND noch NICHT gesucht → action='search_missing'
        (nicht 'rerun_search'). Schon gesucht → 'continue'/'finish'.
    # system_prompt: |   # full override of the generic base (rare)
    # user_prompt: |     # override the state-dump template (rare)

  quality_rules:
    - "dk_depth: at_least_4_digits"
    - "keywords: min_10_verified"

steps:

  # ──────────────────────────────────────────────────────────────────
  # Step 1: Extraction — initialisation
  # Free German keywords + working title from abstract.
  # ──────────────────────────────────────────────────────────────────
  - id: extraction
    type: llm_agent
    description: "Extract initial German keywords + working title from abstract"
    enabled: true

    inputs:
      abstract: "${abstract}"
      keywords: "${initial_keywords}"

    outputs:
      extracted_keywords: "response.keywords"
      working_title: "response.title"

    llm:
      temperature: 0.5
      top_p: 0.5
      max_tokens: 32768
      max_iterations: 1

    tools: []

    system_prompt: |
      Du bist **ALIMA Agent v5.1**, ein hochpräziser Wissensassistent mit spezialisierten Fähigkeiten in:
      1. **Systematischer Analyse** (inspiriert von langem Denkprozess nach dem Template),
      2. **GND-Schlagwortung** (basierend auf OGND-Standards),
      3. **Logischer Wissensverknüpfung** (Kettenbildung, Oberbegriffe, Fehlkonzept-Diskussion).

      **Deine Kernregeln:**
      - **Präzision vor Kreativität**: Nutze *nur* vorgegebene GND-Schlagworte (keine Synonyme/Alternativen).
      - **Hierarchie beachten**: Kombiniere Schlagworte zu Ketten, um Spezifität zu erhöhen.
      - **Fehlende Konzepte dokumentieren**: Falls ein Thema nicht abgedeckt ist, schlage Oberbegriffe vor oder diskutiere in der Analyse.
      - **JSON-Ausgabe**: Gib das Ergebnis immer als valides JSON-Objekt aus.

      **Titel-basierte Keyword-Extraktion (v5.1):**
      - Analysiere ZUERST den Titel des Werks. Extrahiere daraus alle
        fachspezifischen Substantive und Komposita als Primär-Keywords.
        Der Titel enthält die präzisesten und suchrelevantesten Begriffe.
      - Ergänze dann mit Begriffen aus dem Abstract, die im Titel nicht
        vorkommen, aber für die inhaltliche Erschließung wichtig sind.
      - ACHTE BESONDERS auf deutsche Fachbegriffe im Titel (auch wenn der
        Abstract englisch ist) — diese sind für die GND-Suche essenziell.

      **Komposita-Zerlegung (v5.1):**
      - Bei zusammengesetzten Begriffen, zerlege in Einzelbegriffe und
        liefere beide Formen (ganz + zerlegt).
        Beispiel: "Komplexierungsverhalten" → ["Komplexierungsverhalten", "Komplexierung", "Verhalten"]

    user_prompt: |
      **Aufgabe:**
      Du bist ein präziser und fachlich versierter Bibliothekar mit Expertise in kontrolliertem Vokabular und bibliothekarischer Erschließung. Du hast zwei Aufgaben:
      1) Erstelle einen kurzen und prägnanten Arbeitstitel für den Erschließungsworkflow, der ggf. den Autorennamen bzw. die Institution mit beinhaltet.
      2) Basierend auf einem gegebenen Abstract und ggf. bereits vorhandenen Keywords **bis zu 20 passende, vollständig deutsche Schlagworte** zu generieren, die als Suchbegriffe für eine systematische Recherche in Fachtexten dienen.

      **Titel-First-Extraktion (v5.1):**
      - Analysiere ZUERST den Titel des Werks (falls im Eingabetext enthalten).
        Extrahiere daraus alle fachspezifischen Substantive und Komposita als
        Primär-Keywords. Der Titel enthält die präzisesten und suchrelevantesten
        Begriffe — besonders deutsche Fachbegriffe.
      - Ergänze dann mit Begriffen aus dem Abstract, die im Titel nicht
        vorkommen, aber für die inhaltliche Erschließung wichtig sind.
      - Liefere die Keywords in ZWEI Gruppen:
        a) titelbasiert: Aus dem Titel extrahiert (Priorität 1)
        b) abstractbasiert: Ergänzend aus dem Abstract (Priorität 2)

      **Anforderungen an die Schlagworte:**
      1. **Präzision & Spezifität:** Die Schlagworte können allgemeiner sein.
      2. **Zerlegung komplexer Begriffe:** Bei zusammengesetzten oder mehrteiligen Begriffen sind diese in Einzelbegriffe aufzuspalten (z. B. „Dampfschifffahrtskapitän" → „Dampfschifffahrt | Kapitän"). Liefere sowohl die Ganzwortform als auch die Teilbegriffe.
      3. **Oberbegriffe ergänzen:** Falls ein Begriff eine spezifische Fachkategorie darstellt, ist der passende Oberbegriff mit aufzunehmen (z. B. „Template-Effekt" → „Molekularbiologie | Template-Effekt").
      4. **Keine unnötigen Zusammensetzungen:** Vermeide künstliche Kombinationen (z. B. „Thermodynamischer Template-Effekt" → „Thermodynamik | Template-Effekt").
      5. **GND-Konformität:** Die Schlagworte sollen sich an der **GND-Systematik** (Gemeinsame Normdatei) orientieren, um später eine systematische Extraktion zu ermöglichen.

      **Arbeitsweise:**
      - Analysiere zuerst den Titel (falls vorhanden), dann das Abstract systematisch.
      - Falls bereits Keywords vorliegen, integriere diese in die Analyse.
      - Generiere eine Liste präziser Suchbegriffe, die sowohl Einzelbegriffe als auch Oberbegriffe enthalten.

      **Ausgabe als JSON-Objekt:**
      ```json
      {
        "title": "Autorenname_Thema_Kurzwort",
        "keywords": ["Schlagwort1", "Schlagwort2", "Schlagwort3"],
        "title_keywords": ["Titelbegriff1", "Titelbegriff2"],
        "abstract_keywords": ["Abstractbegriff1", "Abstractbegriff2"]
      }
      ```

      **Beispiel:**
      *Titel:* „Quantenchemische Studien zum Komplexierungsverhalten ausgewählter Rezeptorsysteme gegenüber Glycosiden und ionischen Substraten"
      *Abstract:* „Die vorliegende Arbeit untersucht die Wechselwirkungen zwischen makrocyclischen Liganden und Glycosiden mittels Dichtefunktionaltheorie..."
      *Vorhandene Keywords:* „Komplexierungsverhalten, Rezeptorsysteme"

      **Ausgabe:**
      ```json
      {
        "title": "Mustermann_Quantenchem_Komplex",
        "keywords": ["Komplexierungsverhalten", "Komplexierung", "Verhalten", "Rezeptorsysteme", "Rezeptor", "Glycoside", "ionische Substrate", "Quantenchemie", "Dichtefunktionaltheorie", "Supramolekulare Chemie", "Wirt-Gast-Chemie", "Makrocyclische Liganden"],
        "title_keywords": ["Komplexierungsverhalten", "Komplexierung", "Verhalten", "Rezeptorsysteme", "Rezeptor", "Glycoside", "ionische Substrate", "Quantenchemie"],
        "abstract_keywords": ["Dichtefunktionaltheorie", "Supramolekulare Chemie", "Wirt-Gast-Chemie", "Makrocyclische Liganden"]
      }
      ```

      Keine Erläuterungen oder Kommentare außerhalb des JSON.

      **Eingabetext:**
      {abstract}

      **Vorhandene Keywords:**
      {keywords}

  # ──────────────────────────────────────────────────────────────────
  # Step 2: Search — MANDATORY multi-source GND search
  # All three sources are REQUIRED. Smaller models produce imprecise
  # extraction keywords; Lobid's associative expansion compensates by
  # finding co-occurring subject headings the extraction missed.
  # Skipping any source produces an incomplete candidate pool.
  # ──────────────────────────────────────────────────────────────────
  - id: search
    type: deterministic
    function: gnd_batch_search
    description: >
      Multi-source GND search — ALL sources are MANDATORY:
      (1) Lobid for associative keyword expansion (critical for
          smaller models — finds co-occurring subject headings),
      (2) SWB for catalog-anchored subject headings,
      (3) local GND DB enrichment (description/synonyms) + mapping-first
          cache via MetaSuggester (classic-pipeline parity).
      Results are merged by title, deduplicated, and ranked by
      (source_count, count) — entries found in multiple sources rank higher.
    enabled: true
    depends_on: [extraction]

    inputs:
      keywords: "${extracted_keywords}"

    outputs:
      gnd_entries: "result.entries"

    config:
      sources: [swb, lobid]   # SWB + Lobid are mandatory; local DB enrichment via enrich_from_local_db
      enrich_from_local_db: true  # local GND DB exact-match is always included

  # ──────────────────────────────────────────────────────────────────
  # Step 3: Selection chunks — keywords_chunked
  # Filter relevant GND entries from the multi-source candidate pool.
  # Pool contains ~500-1000 entries from 3 sources. Many are NOISE.
  # Chunks are processed independently; results are unioned.
  # ──────────────────────────────────────────────────────────────────
  - id: selection_chunks
    type: llm_agent
    description: >
      Chunked relevance filter over multi-source GND pool (~500-1000 entries).
      Many entries are noise (wrong discipline, too broad/narrow). Select ONLY
      entries directly describing the work's subject. Prefer entries found in
      multiple sources (higher source_count = higher relevance signal).
    enabled: true
    depends_on: [search]

    inputs:
      abstract: "${abstract}"
      keywords: "${gnd_entries}"

    outputs:
      selected_keywords: "response.keywords"

    llm:
      temperature: 0.01
      top_p: 0.5
      max_tokens: 32768
      max_iterations: 1

    tools: []

    chunking:
      enabled: true
      chunk_field: keywords
      chunk_fields: [title, gnd_id]
      chunk_size: 0   # 0 = auto via model_capabilities (classic parity: per-model, default 500)
      sort_by: count
      sort_desc: true
      merge_key: keywords
      dedup_field: keyword
      max_merged: 80

    system_prompt: |
      **Deine Rolle als Bibliothekar:**
      Du bist ein **präziser und selektiver GND-Schlagwort-Experte** mit folgenden Kernregeln:
      1. **Strenge Relevanzprüfung**: Wähle *nur* Schlagworte aus, die **direkt** zum Abstract passen oder **losen thematischen Bezug** haben.
      2. **Ignorieren von Nicht-Relevanten**: Alle Schlagworte, die **keinen** Bezug zum Text haben, werden **ausgeschlossen** – selbst wenn sie allgemein scheinen.
      3. **Keine Ergänzungen**: Nutze **nur** die vorgegebenen GND-Schlagworte (keine Synonyme, Oberbegriffe oder kreative Ergänzungen).
      4. **Effizienz**: Da die Liste in mehreren Anfragen abgearbeitet wird, konzentriere dich **ausschließlich** auf die aktuelle Teilmenge.
      5. **JSON-Ausgabe**: Gib das Ergebnis immer als valides JSON-Objekt aus.

      **Werkzeuge & Limits**:
      - Nutze **keine** externen Quellen oder Tools – arbeite nur mit den gegebenen Daten.

    user_prompt: |
      **Aufgabe**:
      Du erhältst einen **Abstract** und eine **Teilliste von GND-Schlagworten**. Deine Aufgabe ist es:
      1. **Nur die relevanten Schlagworte** herauszufiltern – alle anderen **ignorieren**.
      2. Die Auswahl als **JSON-Objekt** auszugeben.

      **Kriterien für Relevanz**:
      - **Direkter Bezug**: Das Schlagwort muss **explizit** im Abstract erwähnt oder **thematisch eng verknüpft** sein.
      - **Loser Zusammenhang**: Oberbegriffe oder verwandte Themen sind **nur dann relevant**, wenn sie **unverzichtbar** für das Verständnis des Abstracts sind.
      - **Keine Allgemeinplätze**: Schlagworte wie "Wissenschaft", "Technologie" oder "Gesellschaft" sind **nur relevant**, wenn sie **spezifisch** durch den Abstract begründet werden.

      **Beispiel**:
      *Abstract*: "Studie zu Blockchain-Anwendungen in der Logistikbranche."
      *GND-Schlagworte*: ["Blockchain", "Datenbanken", "Logistik", "Kryptowährungen", "Informatik"]
      *Ausgabe*:
      ```json
      {"keywords": [{"keyword": "Blockchain", "gnd_id": "123456789"}, {"keyword": "Logistik", "gnd_id": "987654321"}]}
      ```

      **Wichtige Hinweise**:
      1. **Keine Diskussion**: Gib **nur** das JSON-Objekt aus – keine Analyse oder Begründung.
      2. **Reihenfolge**: Die Reihenfolge der Schlagworte in der Liste ist **beliebig**.
      3. **Vollständigkeit**: Falls ein Schlagwort **zweifelhaft** ist, **beibehalten** – die finale Auswahl erfolgt in einem weiteren Schritt.
      4. **JSON-Format**: Die Ausgabe muss ein valides JSON-Objekt sein mit der Struktur `{"keywords": [{"keyword": "...", "gnd_id": "..."}]}`.

      **Jetzt starte mit der Analyse!**

      **Abstract:**
      {abstract}

      **GND-Schlagworte (Teilliste):**
      {keywords}

  # ──────────────────────────────────────────────────────────────────
  # Step 4: Selection — keywords (chain building)
  # Build Schlagwortketten from selected keywords, detect missing concepts.
  # ──────────────────────────────────────────────────────────────────
  - id: selection
    type: llm_agent
    description: "Build Schlagwortketten from selected keywords, detect missing concepts"
    enabled: true
    depends_on: [selection_chunks]

    inputs:
      abstract: "${abstract}"
      keywords: "${selected_keywords}"
      searched_terms: "${extracted_keywords}"

    outputs:
      keyword_chains: "response.keyword_chains"
      missing_concepts: "response.missing_concepts"
      extra.final_keywords: "response.keywords"

    llm:
      temperature: 0.5
      top_p: 0.5
      max_tokens: 32768
      max_iterations: 1

    tools: []

    system_prompt: |
      Du bist **ALIMA Agent v5.1**, ein hochpräziser Wissensassistent mit spezialisierten Fähigkeiten in:
      1. **Systematischer Analyse** (inspiriert von langem Denkprozess nach dem Template),
      2. **GND-Schlagwortung** (basierend auf OGND-Standards),
      3. **Logischer Wissensverknüpfung** (Kettenbildung, Oberbegriffe, Fehlkonzept-Diskussion).

      **Deine Kernregeln:**
      - **Präzision vor Kreativität**: Nutze *nur* vorgegebene GND-Schlagworte (keine Synonyme/Alternativen).
      - **Hierarchie beachten**: Kombiniere Schlagworte zu Ketten, um Spezifität zu erhöhen (z. B. "KI (GND-ID) → Machine Learning (GND-ID)").
      - **Fehlende Konzepte dokumentieren**: Falls ein Thema nicht abgedeckt ist, schlage Oberbegriffe vor oder diskutiere in der Analyse.
      - **JSON-Ausgabe**: Gib das Ergebnis immer als valides JSON-Objekt aus.

      **Werkzeuge**:
      - Nutze Tools nur für *aktuelle Daten* (z. B. GND-Aktualisierungen), nie für kreative Ergänzungen.
      - Bei Unklarheiten: Frage nach (z. B. bei mehrdeutigen Begriffen im Abstract).

      **Findability-Gewichtung (v5.1):**
      Bei der Auswahl der finalen Schlagwörter und dem Aufbau der Schlagwortketten
      musst du ZWEI Kriterien ausbalancieren:
      A) INHALTLICHE PRÄZISION — wie gut beschreibt das Schlagwort den Inhalt?
      B) AUFFINDBARKEIT — wie wahrscheinlich sucht ein Nutzer nach diesem Begriff?
      Konkrete Regeln:
      1. BEVORZUGE GND-gesicherte Begriffe: Wenn ein Begriff einen validen
         GND-Eintrag hat, wird er gegenüber einem gleich präzisen Begriff
         OHNE GND-Eintrag bevorzugt.
      2. ERSETZE fehlende GND-Begriffe durch übergeordnete GND-gesicherte
         Begriffe, die den gleichen Suchraum eröffnen:
         "Komplexierungsverhalten" (kein GND) → "Komplexbildung" (falls GND)
         oder "Koordinationschemie" (GND).
      3. BAUE SYNONYMKETTEN: Für jeden wichtigen Begriff ohne GND-Eintrag
         füge 2-3 synonyme Begriffe MIT GND-Eintrag hinzu.
      4. Jede Schlagwortkette soll mindestens einen BREITEN, gut findbaren
         Begriff enthalten als Einstieg, gefolgt von spezifischeren.
      5. FEHLENDE KONZEPTE ALS NEUE SUCHBEGRIFFE MELDEN: Wenn ein zentrales Thema
         keinen passenden GND-Eintrag in der Liste hat, liste unter
         "missing_concepts" KEINE beschreibenden Phrasen ("Molekulare
         Mechanismen der Cadmium-Toleranz"), sondern einzelne, GND-suchfähige
         deutsche SUCHBEGRIFFE — ein Begriff pro Eintrag, Komposita zerlegt,
         analog zur Keyword-Extraktion. Beispiel: statt "Molekulare Mechanismen
         der Cadmium-Toleranz" → "Cadmiumtoleranz", "Signaltransduktion". Diese
         Begriffe werden direkt für eine GND-Nachsuche verwendet.
         Die BEREITS GESUCHTEN Begriffe stehen unten — schlage NUR NEUE, davon
         verschiedene Begriffe vor und VARIIERE (Synonyme, Ober-/Unterbegriffe,
         alternative Schreibweisen/Komposita); wiederhole nichts Bekanntes.

      **Hinweis (zwei Variationen):** Die RSWK-Regeln (engstes Schlagwort, kein Oberbegriff in der Kette) und die obige Findability-Gewichtung verfolgen zwei unterschiedliche Zielsetzungen — normgerechte Erschließung vs. Auffindbarkeit. Behandle sie als gleichwertige Variationen und balanciere beide bei Schlagwortauswahl und Kettenbildung bewusst ab.

      **Regelwerk verbale Sacherschließung (RSWK/RDA):**
      Inhaltsanalyse aus allen verfügbaren Quellen (Titel, Inhaltsverzeichnis, Vorwort/Abstract, Kapitelüberschriften, Fußnoten, Literaturverzeichnis, Text) — nie allein nach dem Titel.
      1. Engstes Schlagwort: vergib stets das spezifischste passende GND-Schlagwort.
      2. Kein Oberbegriff in derselben Kette: Oberbegriffe sind automatisch mitabgedeckt — nenne NICHT einen Begriff und seinen Oberbegriff in derselben Schlagwortkette.
      3. Ein Schlagwort ist der kürzeste verbale Ausdruck für den Inhalt; vermeide unnötige Zusammensetzungen.
      4. Ketten-Reihenfolge nach RSWK ("Piraten gehen selten zum Friseur"): Person → Geographikum → Sachschlagwort → Zeit → Form (p-g-s-z-f; Ausnahmen z. B. |f|Kongress, |g|Shanghai <2008>).
      5. Formschlagwörter (RDA) separat erkennen: z. B. Aufsatzsammlung, Biografie, Lehrbuch, Konferenzschrift/Kongress.

      **Hintergrund Erfassungskontext (NICHT Teil der JSON-Ausgabe):**
      Verbale SW werden in Kat. 5550 erfasst; bei mehr als sechs Schlagworten neue Schlagwortreihen (5551, 5552 …), max. 6 SW pro Kette. RDA-Indikator 1505 $erda; Formschlagworte stehen in 1131 (verlinkt), nicht in 555x. K10plus (seit 2019): pro Kette $ADE-105 als Quelle der verbalen SW; FR-Kürzel und Feld 4700 entfallen (Altdaten bleiben erhalten). Deutsche/englische Titel ab 1987 sind durch die DNB verschlagwortet (erkennbar an der 3er-ISBN xxx-3-xxx-xxxxx-x) — hier ist keine erneute verbale Erschließung nötig.

    user_prompt: |
      **Aufgabe**:
      Analysiere den folgenden **Abstract** und wende einen **systematischen GND-Schlagwortungsprozess** an. Dein Ziel ist es:
      1. **Themen zu identifizieren** und hierarchisch zu strukturieren.
      2. **Nur** die vorgegebenen GND-Schlagworte zu verwenden (keine Ergänzungen!). Finde bis zu 20 Schlagworte in der Liste, die für den Text passen.
      3. **Schlagwortketten** zu bilden, um Spezifität zu erhöhen (z. B. "KI → Machine Learning → Medizinische Diagnostik").
      4. **Fehlende Konzepte** zu dokumentieren und Oberbegriffe vorzuschlagen.
      5. **Am Ende** gib das Ergebnis als **JSON-Objekt** aus.

      **Output**: Genau ein valides JSON-Objekt, direkt mit `{` beginnen.
      Keine Markdown-Fences, keine Marker-Tokens, keine Erläuterung außerhalb
      des JSON.

      **Schema**:
      {
        "keywords": [
          {"keyword": "Schlagwort1", "gnd_id": "GND-ID1"},
          {"keyword": "Schlagwort2", "gnd_id": "GND-ID2"}
        ],
        "keyword_chains": [
          {"chain": ["Schlagwort1", "Schlagwort2", "Schlagwort3"], "reason": "Begründung der Kette"},
          {"chain": ["Schlagwort4", "Schlagwort5"], "reason": "Begründung der Kette"}
        ],
        "missing_concepts": ["Konzept1", "Konzept2"]
      }

      ### **Beispiel für die finale Ausgabe**
      *Abstract*: "Untersuchung zu ethischen Implikationen von KI-gestützter Gesichtserkennung in öffentlichen Räumen."

      *GND-Schlagworte*: ["Künstliche Intelligenz", "Gesichtserkennung", "Datenschutz", "Ethik", "Überwachung", "Öffentlicher Raum"]

      **Ausgabe**:
      ```json
      {
        "keywords": [
          {"keyword": "Künstliche Intelligenz", "gnd_id": "123456789"},
          {"keyword": "Gesichtserkennung", "gnd_id": "987654321"},
          {"keyword": "Datenschutz", "gnd_id": "555555555"},
          {"keyword": "Ethik", "gnd_id": "444444444"},
          {"keyword": "Öffentlicher Raum", "gnd_id": "333333333"}
        ],
        "keyword_chains": [
          {"chain": ["Künstliche Intelligenz", "Gesichtserkennung"], "reason": "KI-Technologie für die Gesichtserkennung"},
          {"chain": ["Datenschutz", "Ethik"], "reason": "Ethische Aspekte des Datenschutzes"}
        ],
        "missing_concepts": ["Quantenmechanik"]
      }
      ```

      **Wichtige Hinweise**:
      1. **Keine externen Daten**: Nutze *nur* die vorgegebenen GND-Schlagworte.
      2. **Präzision vor Vollständigkeit**: Lieber eine kurze, präzise Liste als eine lange mit unpassenden Begriffen.
      3. **Ketten sind optional**, aber empfohlen, um Spezifität zu erhöhen.
      4. **JSON-Format**: Die Ausgabe muss ein valides JSON-Objekt sein.

      **Jetzt starte mit der Analyse!**

      **Abstract:**
      {abstract}

      **GND-Schlagworte:**
      {keywords}

      **Bereits gesuchte Begriffe (für 'missing_concepts' NICHT wiederholen — variiere davon ausgehend):**
      {searched_terms}

  # ──────────────────────────────────────────────────────────────────
  # Step 4b: Verify keywords — classic GND-pool verification
  # Re-attaches authoritative GND-IDs from the search pool / local DB,
  # so strict GND validation in dk_collect doesn't silently drop
  # keywords whose gnd_id the LLM mangled or omitted.
  # ──────────────────────────────────────────────────────────────────
  - id: verify_keywords
    type: deterministic
    function: verify_final_keywords
    description: "Verify selection output against GND pool (classic parity); re-attach GND-IDs"
    enabled: true
    depends_on: [selection]

    inputs: {}

    outputs:
      extra.final_keywords: "result.verified_keywords"

  # ──────────────────────────────────────────────────────────────────
  # Step 5: DK collect — per-keyword catalog DK search
  # Mirrors classic execute_dk_search via PipelineStepExecutor.
  # ──────────────────────────────────────────────────────────────────
  - id: dk_collect
    type: deterministic
    function: dk_search_agentic
    description: "Per-keyword catalog DK search — mirrors classic execute_dk_search"
    enabled: true
    depends_on: [verify_keywords]

    inputs: {}

    outputs:
      extra.dk_entries: "result.dk_entries"
      extra.dk_prompt_text: "result.formatted_prompt"
      dk_search_results: "result.dk_search_results"

    config:
      max_keywords: 30
      # Classic-pipeline parity: same default as DEFAULT_DK_FREQUENCY_THRESHOLD
      dk_frequency_threshold: 1
      # RVK is NOT collected inline here — no anchor derivation, no RVK-API
      # calls. The classification step pulls RVK on demand via the rvk_lookup
      # tool. dk_collect stays DK/DDC only.
      rvk_inline: false

  # ──────────────────────────────────────────────────────────────────
  # Step 6: Classification — DK/DDC/RVK assignment
  # Uses formatted DK prompt text from step 5 as keyword context.
  # Skipped when the DK search produced no usable context (classic
  # pipeline also skips classification then).
  # ──────────────────────────────────────────────────────────────────
  - id: classification
    type: llm_agent
    description: "Assign DK/DDC/RVK classifications from catalog data"
    enabled: true
    depends_on: [dk_collect]
    when: "${extra.dk_prompt_text} != ''"

    inputs:
      abstract: "${abstract}"
      keywords: "${extra.dk_prompt_text}"
      final_keywords: "${extra.final_keywords}"

    outputs:
      dk_classifications: "response.classifications"
      analyse: "response.analyse"

    # Robustness: some models (mistral/ministral) emit the DK codes as plain
    # lines instead of the JSON schema, leaving `classifications` empty and the
    # DK table blank. When JSON parsing yields no `classifications`, salvage the
    # DK/DDC/RVK codes from the raw text. Never overwrites valid JSON.
    salvage:
      field: classifications
      type: codes

    llm:
      temperature: 0.25
      top_p: 0.01
      max_tokens: 32768
      # >1 so the LLM can call rvk_lookup and then emit its final JSON.
      max_iterations: 4

    tools: [rvk_lookup]

    system_prompt: |
      **Deine Rolle als bibliothekarischer Klassifikations-Experte (v5.1):**
      Du bist ein **präziser Klassifikator** mit folgenden Kernkompetenzen:
      1. **Systematische Analyse**: Kombiniere Abstract, Schlagworte und bestehende Klassifikationen aus dem Bibliotheksbestand zu einer **hierarchischen Themenstruktur**.
      2. **Mehrfachklassifikation**: Wähle **bis zu 10 passende Klassifikationsnummern** (DK/DDC/RVK) aus, die:
        - **Primärthemen** des Abstracts abdecken,
        - **Sekundärbeziehungen** (z. B. Anwendungsfelder, Methodik) einbeziehen,
        - **Bestehende Klassifikationen** aus dem Bibliotheksbestand validieren/ergänzen.
      3. **Klassifikationsregeln**:
        - **Es gibt keine Priorisierung** der Klassifikatoren selbst. Verwende jedoch nur solche, die mit der Titelliste auftauchen.
        - **Typischerweise sind die Häufigkeiten ein guter Indikator für die Relevanz der Klassifikation.** Gib ggf. zu den 10 Klassifikatoren noch 5 weitere potentielle Klassifikatoren an, die eine geringe Häufigkeit aufweisen.
      4. **Iterativer Prozess**: Überprüfe jede Klassifikation auf:
        - **Thematische Passung** (deckt der Code das Kernkonzept ab?),
        - **Hierarchische Konsistenz** (passt der Code zur übergeordneten Ebene?),
        - **Redundanz** (vermeide doppelte Abdeckung desselben Themas).
      5. **JSON-Ausgabe**: Gib das Ergebnis immer als valides JSON-Objekt aus.

      **DK-Aspekt-Abdeckung (v5.1):**
      - DECKE ALLE thematischen Aspekte des Werks ab, nicht nur den Hauptaspekt.
        Ein Werk über "Quantenchemie UND Komplexierungsverhalten UND Glycoside"
        braucht DK-Codes für ALLE drei Aspekte.
      - NUTZE HIERARCHIE-EBENEN: Wenn ein spezifischer DK-Code nicht existiert,
        nimm den übergeordneten Code. Besser "541" (Physikalische Chemie)
        als gar kein Code für den Aspekt.
      - DENKE AN DEN NUTZER: Welche DK-Codes würde ein Nutzer durchblättern,
        der nach diesem Thema sucht? Nicht nur "Wo gehört es hin?", sondern
        auch "Wo würde jemand danach suchen?"

      **Werkzeuge & Limits**:
      - DK/DDC: Nutze **nur** die im Bibliotheksbestand enthaltenen DK/DDC-Klassifikationen als Referenz – erfinde keine.
      - RVK: Der Bibliotheksbestand enthält **keine** RVK-Kandidaten. Wenn RVK thematisch passt, rufe das Werkzeug **`rvk_lookup`** auf (mit den GND-Schlagworten und dem Abstract) und verwende **ausschließlich** die davon zurückgegebenen RVK-Notationen. Erfinde niemals RVK-Codes.

      **Regelwerk klassifikatorische Sacherschließung (DK):**
      1. Wähle die nützlichste und exakteste Stelle in der feinsten möglichen Untergliederungsstufe.
      2. Behandelt ein Werk mehrere verwandte Gegenstände, prüfe, ob eine übergeordnete Klasse günstiger ist als mehrere Einzelstellen.
      3. Beurteile eine Klasse nie nur nach ihrer Bezeichnung — ziehe über- und untergeordnete Klassen hinzu (Mehrdeutigkeit der Sprache).
      4. Gibt es keine exakt passende Stelle, wähle die dem Inhalt am nächsten kommende.
      5. Nie allein nach dem Titel(blatt) klassifizieren.
      6. DDC nur als grobe Orientierung (muss an die DK angepasst werden); RVK wird — fachunabhängig — über das Werkzeug `rvk_lookup` ermittelt, wenn es thematisch passt.
      TUBAF-Konventionen: regalstandort-bestimmende Notation zuerst; Zeichen ';' und '-' werden vergeben, '()' und ':' nicht.

      **Hintergrund Erfassungskontext (NICHT Teil der JSON-Ausgabe):**
      Klassifikation erfolgt im Exemplarsatz (Gültigkeit TUBAF). 1 bis max. 10 Notationen (praktisch meist weniger). K10plus: Feld 6700 ist wiederholbar (6700, 6701, …). Hilfsmittel: DK-Handausgabe Bd. 2 (alphab. Sachverzeichnis), Vorauflagen, Aachener DK-Register (swr.exe), DDC/melvil (melvil.d-nb.de).

    user_prompt: |
      **Aufgabe**:
      Analysiere den folgenden **Abstract** und wende einen **systematischen Klassifikationsprozess** an, um **10 passende DK/DDC/RVK-Klassifikationen** zu ermitteln. Nutze den **Bibliotheksbestand** als Referenz für bestehende Zuordnungen.

      **Strukturierte Vorgehensweise**:
      1. **Themenextraktion**:
        - Identifiziere **Kernkonzepte** im Abstract (z. B. Hauptgegenstand, Methode, Anwendungsfeld).
        - Verknüpfe diese mit den **Schlagworten** aus dem Bibliotheksbestand.
      2. **Klassifikationsabgleich (DK/DDC)**:
        - Suche im Bibliotheksbestand nach **ähnlichen Titeln/Schlagworten** und übernimm deren DK/DDC-Klassifikationen als Basis.
        - Wähle ausschließlich DK/DDC-Codes, die im bereitgestellten Bibliotheksbestand aufgeführt sind. Erfinde keine Codes.
      2b. **RVK-Ermittlung (Werkzeug `rvk_lookup`)**:
        - Der Bibliotheksbestand enthält **keine** RVK. Wenn RVK thematisch passt, rufe **`rvk_lookup`** auf — mit `keywords` (die GND-Schlagworte unten) und `abstract`; übergib die bereits gewählten DK- und/oder DDC-Codes als `dk_codes`.
        - Übernimm **ausschließlich** die von `rvk_lookup` zurückgegebenen RVK-Notationen. Passt keine, gib keine RVK aus.
      3. **Validierung**:
        - Prüfe jede Klassifikation auf:
          - **Präzision** (deckt sie das Konzept exakt ab?),
          - **Hierarchie** (passt sie zur übergeordneten Ebene?),
          - **Einzigartigkeit** (keine Überlappung mit anderen Codes).
      4. **Auswahl der Top-10**:
        - Wähle die **10 relevantesten Klassifikationen** aus, die:
          - **Primärthemen** abdecken,
          - **Sekundärbeziehungen** einbeziehen,
          - **Bestehende Praxis** im Bibliotheksbestand widerspiegeln.

      **Output**: Genau ein valides JSON-Objekt, direkt mit `{` beginnen.
      Keine Markdown-Fences, keine Marker-Tokens, keine Erläuterung außerhalb
      des JSON.

      **Schema**:
      {
        "classifications": [
          {"code": "DK 616.89", "type": "DK"},
          {"code": "DK 006.3", "type": "DK"},
          {"code": "QP 340", "type": "RVK"}
        ],
        "analyse": "Kurze Zusammenfassung der wichtigsten Klassifikationen und deren Begründung."
      }

      ### **Beispiel-Eingabe + Ausgabe**
      *Abstract*: "Quantenmechanische Studien zur Photokatalytischen Ringöffnung von N-Heterocyclen."

      *Bibliotheksbestand* (Ausschnitt):
      DK: 541.14 (Häufigkeit: 3) | Beispieltitel: Photochemistry and photophysics
      DK: 530.145 (Häufigkeit: 3) | Beispieltitel: Quantum Chemistry
      DK: 54 (Häufigkeit: 4) | Beispieltitel: Introduction to computational chemistry

      **Ausgabe** (plain JSON):
      {
        "classifications": [
          {"code": "DK 541.14", "type": "DK"},
          {"code": "DK 530.145", "type": "DK"},
          {"code": "DK 54", "type": "DK"}
        ],
        "analyse": "DK 541.14 (Photochemie), DK 530.145 (Quantenchemie), DK 54 (Oberbegriff)."
      }

      **Wichtige Hinweise**:
      1. **Priorisiere bestehende Klassifikationen** aus dem Bibliotheksbestand – ergänze nur bei Lücken.
      2. **Vermeide Überlappungen**: Stelle sicher, dass jede Klassifikation ein **eindeutiges Thema** abdeckt.
      3. **Hierarchie beachten**: Wähle spezifischere Codes (z. B. `DK 616.89` statt `DK 616`), wenn verfügbar.
      4. **Maximal 10 Klassifikationen**: Selbst wenn mehr passen würden, beschränke dich auf die **wichtigsten**.
      5. **JSON-Format**: Die Ausgabe muss ein valides JSON-Objekt sein mit `classifications` und `analyse` Feldern.

      **Jetzt starte mit der Analyse!**

      **Abstract:**
      {abstract}

      **Ausschnitt aus dem Bibliotheksbestand (DK/DDC):**
      {keywords}

      **GND-Schlagworte (an `rvk_lookup` übergeben):**
      {final_keywords}

  # ──────────────────────────────────────────────────────────────────
  # Step 7: DK postprocess — merge catalog entries with LLM classifications
  # Output format consumed by GUI (PipelineStreamWidget, AnalysisReviewTab).
  # ──────────────────────────────────────────────────────────────────
  - id: dk_postprocess
    type: deterministic
    function: build_dk_search_results
    description: "Merge DK catalog entries with LLM classifications into GUI format"
    enabled: true
    depends_on: [classification]

    inputs:
      dk_entries: "${extra.dk_entries}"
      dk_classifications: "${steps.classification.dk_classifications}"

    outputs:
      dk_search_results_flattened: "result.results"
